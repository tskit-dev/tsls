name: Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:

  packaging:
    name: Python packaging
    uses: tskit-dev/.github/.github/workflows/python-packaging.yml@v22

  test-c:
    name: C tests
    uses: tskit-dev/.github/.github/workflows/c-tests.yml@v22
    with:
      library-directory: lib
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Python
    uses: tskit-dev/.github/.github/workflows/python-tests.yml@v22
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      coverage-directory: tsls
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        python: [ "3.11", "3.14" ]
        # The C code uses GCC/Clang builtins, so Windows isn't supported yet.
        os: [ macos-latest, ubuntu-24.04 ]
