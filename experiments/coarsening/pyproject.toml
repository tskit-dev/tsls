[project]
name = "tsls-coarsening-experiments"
version = "0.0.0"
description = "Experiments on coarsening the recombination map and likelihood values in tsls."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "pandas",
    "tabulate",
    "tqdm",
    "tskit>=1.0.0",
    "tsls",
]

[tool.uv]
package = false

[tool.uv.sources]
tsls = { path = "../../tsls", editable = true }

[tool.ruff]
line-length = 89

[tool.ruff.lint.isort]
known-first-party = ["tsls"]
