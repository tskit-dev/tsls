[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "numpy>=2"
]
build-backend = "setuptools.build_meta"

[project]
name = "tsls"
version = "0.0.1.dev0"
authors = [
    {name = "Tskit Developers", email = "admin@tskit.dev"},
]
description = "The Li and Stephens HMM on a tree sequence."
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2",
    "tskit>=1.0.0",
]

[project.urls]
"Source Code" = "https://github.com/tskit-dev/tsls/"

[dependency-groups]
test = [
    "msprime",
    "pytest",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools]
packages = ["tsls"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 89
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "N", "UP", "A", "PT", "PLC0415"]

ignore = [
    "A001", "A002", "RUF",
    "B905", #Don't add strict=False to zips (B905)
    "N806", "N802", "N803", # Various nags about uppercase vars
    "N818", # Exceptions not called "Error"
    "UP032", # Don't upgrade to f strings
    "B904", # raise from-issues
    "PT011", # pytest.raises(ValueError) too broad
    "PT012", # pytest.raises() block should contain a single simple statement
    "B028", # No stacklevel for warnings
    "B017", # Do not assert blind exception: `BaseException`
]

[tool.ruff.lint.isort]
known-first-party = ["_tsls", "dense", "tsls"]
known-third-party = ["numpy", "pytest", "tskit"]
